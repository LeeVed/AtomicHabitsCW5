# user www-data;
# автонастройка количество процессов в соответствии с числом доступных CPU
# worker_processes auto;
# путь к файлу, в котором будет храниться идентификатор процесса Nginx.
# pid /run/nginx.pid;
# максимальное количество соединений, которые каждый процесс может обрабатывать одновременно
# events {
#     worker_connections 1024;
# }
#
# http {

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }
}
