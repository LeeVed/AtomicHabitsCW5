name: Django CI

on: [push, pull_request]

jobs:
  # запуск линтеров
  lint:
    runs-on: ubuntu-latest
    steps:
      # получаем код из репозитория
      - name: Check out code
        uses: actions/checkout@v3
      # устанавливаем python нужной версии
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      # устанавливаем Poetry
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      # устанавливаем зависимости
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      # устанавливаем flake8
      - name: Run flake8
        run: poetry run flake8 .
  # запуск тестов
  test:
    # только после успешного запуска линтеров
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run tests
        env:
          SECRET_KEY: "django-insecure-temporary-key-for-ci"
          NAME: test_db
          USER: test_user
          PASSWORD: test_pass
          HOST: localhost
          PORT: 5432
          REDIS_URL: redis://localhost:6379
          BOT_TOKEN: test_token
        run: poetry run python manage.py test

  # сборка докер-образа
  build:
    # только после успешных тестов
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3
      # авторизация в docker hub через секреты
      - name: Log in in Docker hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin
      # собираем докер-образ на основе последнего коммита
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/habits-api:${{ github.sha }} .
      # отправка собранного образа в docker hub
      - name: Push Docker image in Docker hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/habits-api:${{ github.sha }}

  deploy:
    # только после успешной сборки docker-образа
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << "EOF"
          # Переход в папку проекта на сервере
          cd /opt/habits 
          # Получение последней версии кода
          git pull 
          # Скачивание свежих образов
          docker-compose pull 
          # Запуск всех 6 контейнеров
          docker-compose up -d --build 
          # Очистка старых образов и кэша
          docker system prune -f                
          EOF
